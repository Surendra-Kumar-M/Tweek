{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tweek{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Tweek — Share moments with the world{% endblock %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(-45deg, #8EC5FC, #E0C3FC, #FFD3A5, #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
        }
        .bubble {
            position: fixed;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            opacity: 0.7;
            animation: float 10s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            50% { transform: translateY(-200px) scale(1); opacity: 0.8; }
            100% { transform: translateY(-400px) scale(0.3); opacity: 0; }
        }
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body class="{% block body_class %}flex flex-col items-center justify-center min-h-screen{% endblock %}">
    {% block content %}{% endblock %}

    <script>
        // Animated background bubbles
        (function() {
            for (let i = 0; i < 20; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 20 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.top = `${Math.random() * 100}vh`;
                bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
                document.body.appendChild(bubble);
            }
        })();
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
