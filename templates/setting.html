{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Tweek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(-45deg, #8EC5FC, #E0C3FC, #FFD3A5, #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            opacity: 0.7;
            animation: float 10s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            50% { transform: translateY(-200px) scale(1); opacity: 0.8; }
            100% { transform: translateY(-400px) scale(0.3); opacity: 0; }
        }
    </style>
</head>
<script>
    document.addEventListener("DOMContentLoaded", function() {
            for (let i = 0; i < 20; i++) {
                let bubble = document.createElement("div");
                bubble.classList.add("bubble");
                let size = Math.random() * 20 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.top = `${Math.random() * 100}vh`;
                bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
                document.body.appendChild(bubble);
            }
        });
</script>
<body class="flex flex-col items-center justify-center min-h-screen">
    
    <!-- Header -->
    <header class="w-full p-4 flex justify-between items-center bg-white/40 backdrop-blur-md shadow-lg border-b border-white/20">
        <a href="/" class="text-3xl font-bold text-gray-900 uppercase">Tweek</a>
    </header>
    
    <!-- Settings Container -->
    <div class="w-full max-w-2xl bg-white/40 backdrop-blur-xl p-6 rounded-xl shadow-lg border border-white/20 mt-10">
        <h1 class="text-2xl font-bold text-gray-900 text-center">Account Settings for <b>{{ user.username }}</b></h1>
        <br>
        
        <form action="" method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            
            <!-- Profile Image Upload -->
            <div class="flex flex-col items-center">
                <img src="{{ user_profile.profileimg.url }}" alt="profile pic" class="w-24 h-24 rounded-full border shadow-lg">
                <label class="mt-2 font-semibold">{{ user.username }}</label>
                <input type="file" name="image" accept="image/png, image/gif, image/jpeg" class="mt-2 w-full text-center">
            </div>
            
            <!-- Bio Section -->
            <div>
                <label for="bio" class="block text-gray-900 font-semibold">Bio</label>  
                <textarea id="bio" name="bio" rows="3" class="w-full p-2 border rounded-lg bg-white/70 text-gray-900 focus:ring-2 focus:ring-blue-400">{{ user_profile.bio }}</textarea>
            </div>
            
            <!-- Location Section -->
            <div>
                <label for="location" class="block text-gray-900 font-semibold">Location</label>
                <input type="text" name="location" value="{{ user_profile.location }}" class="w-full p-2 border rounded-lg bg-white/70 text-gray-900 focus:ring-2 focus:ring-blue-400">
            </div>
            
            <!-- Buttons -->
            <div class="flex justify-between">
                <a href="/" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">Save</button>
            </div>
        </form>
    </div>
</body>
</html>
